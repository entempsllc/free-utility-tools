<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Password Generator - Create Secure Passwords</title>
    <meta name="description" content="Generate secure, random passwords instantly. Free online password generator with customizable options.">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 2rem; background: #f9fafb; }
        h1 { color: #1f2937; }
        .output { background: white; padding: 1.5rem; border-radius: 8px; text-align: center; font-size: 1.5rem; font-family: monospace; margin: 1rem 0; border: 2px solid #1d4ed8; }
        .options { background: white; padding: 1.5rem; border-radius: 8px; margin: 1rem 0; }
        label { display: block; margin: 0.5rem 0; }
        button { background: #1d4ed8; color: white; border: none; padding: 1rem 2rem; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; }
        button:hover { background: #1e40af; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #1d4ed8; text-decoration: none; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to Free Utility Tools</a>
    <h1>Password Generator</h1>
    <p>Generate secure, random passwords instantly.</p>
    
    <div class="output" id="output">Click Generate</div>
    
    <div class="options">
        <label>Length: <input type="number" id="length" value="16" min="4" max="64"></label>
        <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
        <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
        <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
        <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%^&*)</label>
    </div>
    
    <button onclick="generate()">Generate Password</button>

    <script>
        function generate() {
            const length = document.getElementById('length').value;
            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lower = 'abcdefghijklmnopqrstuvwxyz';
            const nums = '0123456789';
            const syms = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            let chars = '';
            if (document.getElementById('uppercase').checked) chars += upper;
            if (document.getElementById('lowercase').checked) chars += lower;
            if (document.getElementById('numbers').checked) chars += nums;
            if (document.getElementById('symbols').checked) chars += syms;
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('output').textContent = password;
        }
    </script>
</body>
</html>
